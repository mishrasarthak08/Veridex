name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: |
          cd backend
          uv sync --dev
          
      - name: Run Bandit (Security Scan)
        run: |
          cd backend
          uv run bandit -ll -r app/
          
      - name: Start Docker Services
        run: |
          docker compose up -d
          sleep 10

      - name: Run Tests (Pytest)
        run: |
          cd backend
          uv run pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: |
          cd frontend
          npm install
          npx playwright install chromium --with-deps
          
      - name: Lint and Build
        run: |
          cd frontend
          npm run build
          
      - name: Run Unit Tests (Jest)
        run: |
          cd frontend
          npm run test -- --passWithNoTests
          
      - name: Run E2E Tests (Playwright)
        run: |
          cd frontend
          npx playwright test
