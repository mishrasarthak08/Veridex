# policies.yaml
# Defines endpoint access based on role

policies:
  - path: "/api/v1/users/*"
    method: "*"
    roles: ["admin"]
    
  - path: "/api/v1/auth/me"
    method: "GET"
    roles: ["user", "admin"]
    
  - path: "/api/v1/connectors"
    method: "*"
    roles: ["admin"]
    
  - path: "/api/v1/evaluations/*"
    method: "*"
    roles: ["admin", "auditor"]
    
  - path: "/api/v1/telemetry/*"
    method: "GET"
    roles: ["admin", "auditor", "user"]

  - path: "/api/v1/resilience/*"
    method: "*"
    roles: ["admin"]
