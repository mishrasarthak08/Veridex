policies:
  - id: "require_admin_for_connector"
    name: "Require Admin for Connector Invocation"
    description: "Only users with the admin role can invoke global connectors."
    resource: "connector"
    action: "invoke"
    effect: "allow"
    condition: "'admin' in user.roles"

  - id: "allow_workspace_read"
    name: "Allow Workspace Read"
    description: "Users with read permission on workspace can read workspace."
    resource: "workspace"
    action: "read"
    effect: "allow"
    condition: "user_has_permission(user, 'workspace', 'read')"

  - id: "allow_project_read"
    name: "Allow Project Read"
    description: "Users with read permission on project can read project."
    resource: "project"
    action: "read"
    effect: "allow"
    condition: "user_has_permission(user, 'project', 'read')"

  - id: "allow_project_write"
    name: "Allow Project Write"
    description: "Users with write permission on project can modify project."
    resource: "project"
    action: "write"
    effect: "allow"
    condition: "user_has_permission(user, 'project', 'write')"

  - id: "allow_evaluation_read"
    name: "Allow Evaluation Read"
    description: "Users with read permission can read evaluation runs."
    resource: "evaluation"
    action: "read"
    effect: "allow"
    condition: "true"

  - id: "allow_evaluation_write"
    name: "Allow Evaluation Write"
    description: "Users with write permission can run evaluations."
    resource: "evaluation"
    action: "write"
    effect: "allow"
    condition: "true"

  - id: "allow_resilience_read"
    name: "Allow Resilience Read"
    description: "Users can read resilience streams."
    resource: "resilience"
    action: "read"
    effect: "allow"
    condition: "true"

  - id: "allow_connector_read"
    name: "Allow Connector Read"
    description: "Users can read their own connectors."
    resource: "connector"
    action: "read"
    effect: "allow"
    condition: "true"

  - id: "allow_connector_write"
    name: "Allow Connector Write"
    description: "Users can create and update their own connectors."
    resource: "connector"
    action: "write"
    effect: "allow"
    condition: "true"

  - id: "allow_connector_delete"
    name: "Allow Connector Delete"
    description: "Users can delete their own connectors."
    resource: "connector"
    action: "delete"
    effect: "allow"
    condition: "true"

  - id: "allow_chat_read"
    name: "Allow Chat Read"
    description: "Users can read their own chats."
    resource: "chat"
    action: "read"
    effect: "allow"
    condition: "true"

  - id: "allow_chat_write"
    name: "Allow Chat Write"
    description: "Users can send messages to chat."
    resource: "chat"
    action: "write"
    effect: "allow"
    condition: "true"
